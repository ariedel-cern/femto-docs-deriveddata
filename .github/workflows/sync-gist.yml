name: Sync gist

on:
  push:
    branches: [main]
    paths:
      - output/LHC22o_pass7_minBias/cuts.md
      - output/LHC23_pass4_thin/cuts.md
      - output/LHC24_pass1_minBias/cuts.md
      - output/LHC25_pass1_minBias/cuts.md
      - output/LHC24_pass1_minBias_lite/cuts.md
      - output/LHC25_pass1_minBias_lite/cuts.md
      - output/LHC26_pass1_thin/cuts.md

jobs:
  sync-gist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - path: output/LHC22o_pass7_minBias/cuts.md
            gist_id: 56975617144260b07692a8adcf3df2c1
          - path: output/LHC23_pass4_thin/cuts.md
            gist_id: 12fe4f7ebfe13fa3d81fdb2a4df18bda
          - path: output/LHC24_pass1_minBias/cuts.md
            gist_id: 4c7a7fda5be717e3e509b6cd22b40497
          - path: output/LHC25_pass1_minBias/cuts.md
            gist_id: 290e53c15fce3c78a6d3442d53ffc241
          - path: output/LHC24_pass1_minBias_lite/cuts.md
            gist_id: 8686d4f4fd97c440eeca4d922546fbeb
          - path: output/LHC25_pass1_minBias_lite/cuts.md
            gist_id: 25d9f4c47df5dcf3c41e8049283ac6ae
          - path: output/LHC26_pass1_thin/cuts.md
            gist_id: c5060b35f7c4d21c5d256c542c1391b9
    steps:
      - uses: actions/checkout@v4

      - name: Push cuts.md content to gist, pruning any other files
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ matrix.gist_id }}
        run: |
          set -euo pipefail
          existing=$(gh api "gists/${GIST_ID}" --jq '.files | keys')
          jq -n \
            --argjson existing "$existing" \
            --rawfile content "${{ matrix.path }}" \
            '{
              files: (
                (reduce ($existing[] | select(. != "cuts.md")) as $f ({}; . + {($f): null}))
                + {"cuts.md": {content: $content}}
              )
            }' > payload.json
          gh api -X PATCH "gists/${GIST_ID}" --input payload.json
